[env]
UV_PYTHON_PREFERENCE = "only-system"

[tools]
actionlint = "1.7.12"
python = "3.12.16"
shellcheck = "0.11.0"
uv = "0.13.10"

[tasks.check]
shell = "bash -euo pipefail -c"
run = [
  "uv sync --locked",
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run vulture",
  "uv run pytest",
  "actionlint",
]
