[project]
name = "pr-policy-gate"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.6",
  "vulture==2.16",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "ERA", "PIE", "PT", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=pr_policy_gate --cov-report=term"

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 100

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
